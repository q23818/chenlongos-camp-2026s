main:
  push:
    - docker:
        image: sophgo/tpuc_dev:latest
      stages:
        - name: install tpu_mlir
          script: pip install tpu_mlir[onnx]

        - name: download resources
          script: |
            wget -q https://github.com/ultralytics/yolov5/releases/download/v6.0/yolov5s.onnx
            wget -q https://github.com/sophgo/tpu-mlir/releases/latest/download/tpu-mlir-resource.tar
            tar -xf tpu-mlir-resource.tar
            mv regression/ tpu-mlir-resource/
            mkdir -p model_yolov5s/workspace
            cp yolov5s.onnx model_yolov5s/
            cp -rf tpu-mlir-resource/dataset/COCO2017 model_yolov5s/
            cp -rf tpu-mlir-resource/image model_yolov5s/

        - name: detect with onnx -> dog_onnx.jpg
          script: |
            cd model_yolov5s
            detect_yolov5 --input ./image/dog.jpg --model ./yolov5s.onnx --output dog_onnx.jpg

        - name: onnx -> mlir
          script: |
            cd model_yolov5s/workspace
            model_transform \
              --model_name yolov5s \
              --model_def ../yolov5s.onnx \
              --input_shapes [[1,3,640,640]] \
              --mean 0.0,0.0,0.0 \
              --scale 0.0039216,0.0039216,0.0039216 \
              --keep_aspect_ratio \
              --pixel_format rgb \
              --output_names 350,498,646 \
              --test_input ../image/dog.jpg \
              --test_result yolov5s_top_outputs.npz \
              --mlir yolov5s.mlir

        - name: mlir -> f16 bmodel
          script: |
            cd model_yolov5s/workspace
            model_deploy \
              --mlir yolov5s.mlir \
              --quantize F16 \
              --processor bm1684x \
              --test_input yolov5s_in_f32.npz \
              --test_reference yolov5s_top_outputs.npz \
              --tolerance 0.99,0.99 \
              --model yolov5s_1684x_f16.bmodel

        - name: detect with f16 bmodel -> dog_f16.jpg
          script: |
            cd model_yolov5s
            detect_yolov5 --input ./image/dog.jpg --model ./workspace/yolov5s_1684x_f16.bmodel --output dog_f16.jpg

        - name: calibration for int8
          script: |
            cd model_yolov5s/workspace
            run_calibration yolov5s.mlir \
              --dataset ../COCO2017 \
              --input_num 100 \
              -o yolov5s_cali_table

        - name: mlir -> int8 bmodel
          script: |
            cd model_yolov5s/workspace
            model_deploy \
              --mlir yolov5s.mlir \
              --quantize INT8 \
              --calibration_table yolov5s_cali_table \
              --processor bm1684x \
              --test_input yolov5s_in_f32.npz \
              --test_reference yolov5s_top_outputs.npz \
              --tolerance 0.85,0.45 \
              --model yolov5s_1684x_int8_sym.bmodel

        - name: detect with int8 bmodel -> dog_int8_sym.jpg
          script: |
            cd model_yolov5s
            detect_yolov5 --input ./image/dog.jpg --model ./workspace/yolov5s_1684x_int8_sym.bmodel --output dog_int8_sym.jpg

        - name: commit results back to repo
          script: |
            mkdir -p homework/03-tpu-mlir/01-ci/results
            mkdir -p homework/03-tpu-mlir/02-manual/models
            cp model_yolov5s/dog_onnx.jpg homework/03-tpu-mlir/01-ci/results/
            cp model_yolov5s/dog_f16.jpg homework/03-tpu-mlir/01-ci/results/
            cp model_yolov5s/dog_int8_sym.jpg homework/03-tpu-mlir/01-ci/results/
            cp model_yolov5s/workspace/yolov5s_1684x_f16.bmodel homework/03-tpu-mlir/02-manual/models/
            cp model_yolov5s/workspace/yolov5s_1684x_int8_sym.bmodel homework/03-tpu-mlir/02-manual/models/
            git config user.email "ci@cnb.cool"
            git config user.name "CI Bot"
            git add homework/03-tpu-mlir/01-ci/ homework/03-tpu-mlir/02-manual/models/
            git commit -m "ci: update detection results and bmodels"
            git push
